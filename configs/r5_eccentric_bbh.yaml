# WP7 campaign config template -- R5 eccentricBBH
#
# Source: F4 campaign sheet, section "R5 -- eccentricBBH". Priority raised
# P1 -> P0-time-sensitive (REV1: the Gupte arXiv:2603.29019 v2 correction vehicle).
# Soft prerequisites: R2 + R3 (supply D_BBH / the BBH rho_thr refit anchor).
#
# Nominal N = 100,000 (5000 x 20); FALLBACK 60,000 (3000 x 20) if a pilot job shows
# SEOBNRv5EHM generation dominates cost (F4 sheet section 5, pilot protocol) -- this
# template ships the nominal size; edit njobs/n_total to switch to the fallback.
#
# SEOBNRv5EHM requires pyseobnr (sbank/waveforms.py's _HAVE_PYSEOBNR guard) --
# use container/sbank-igwn.def, not the lighter igwn-py311 native env.
# fallback_approximant documents (does not auto-select) the TaylorF2Ecc fallback if
# pyseobnr is unavailable on a given pool node -- per WP2_memo.md, TaylorF2Ecc lacks
# SEOBNRv5EHM's merger/precession content, so a TaylorF2Ecc-generated R5 map must be
# flagged as a degraded/inspiral-only substitute, not a silent equivalent.

run:
  name: eccentricBBH
  banks: [allsky]   # SSM is irrelevant above 3 Msun; ff_best := ff_stellar
  apply_no_ilwdchar: true
  emit_plot: true

injections:
  - name: eccentricBBH
    injection_file: "{{INJECTION_FILE_R5}}"
    approximant: SEOBNRv5EHM
    fallback_approximant: TaylorF2Ecc   # documentation only; see header note
    n_total: 100000
    njobs: 5000
    injections_per_job: 20
    params:
      mtotal: {dist: log-uniform, min: 10.0, max: 100.0, unit: Msun, frame: detector}
      mass_ratio_q: {dist: uniform, min: 1.0, max: 4.0}
      spin1z: {dist: uniform, min: -0.9, max: 0.9}
      spin2z: {dist: uniform, min: -0.9, max: 0.9}
      eccentricity: {dist: mixture, f_ref_hz: 20,
                     components: [
                       {weight: 0.9, dist: log-uniform, min: 0.01, max: 0.3},
                       {weight: 0.1, dist: log-uniform, min: 0.3, max: 0.5,
                        note: "tail block reaching the Wang & Nitz e=0.5 anchor"}]}
      mean_anomaly: {dist: uniform, min: 0.0, max: 6.283185307, note: "randomize + record"}
    notes: "Bracket-only deliverable [pure-FF, FF+D_BBH]; D_BBH from the R2+R3 refit
           (not D_BNS -- would be a double transfer of morphology AND mass region).
           Threshold convention = the BBH-refit rho_thr (measured on the local
           mixture-HDF BBH region with R3's FF>=0.97 aligned control as reference),
           NOT the BNS (11.14/10)^3 factor. See F4 sheet R5 for the full REV1 caveats."

banks:
  allsky:
    path: "{{BANK_PATH_ALLSKY}}"
    # BBH-region stellar bank: IMR templates (Sakon+2024/Hanna+2025), not TaylorF2 --
    # leave approximant unset so sbank_sim honors the bank's own per-template column
    # (F4 sheet section 1.3 note / section 4.4).

psd:
  reference_psd: "{{PSD_PATH}}"
  instrument: L1
  flow: 15.0

eccentric:
  ecc_columns: "alpha2:alpha3"
  ecc_f_ref: 20.0

condor:
  accounting_group: "{{ACCOUNTING_TAG}}"
  accounting_group_user: "{{ACCOUNTING_USER}}"
  request_memory: 3999
  request_disk: "4096MB"
  request_cpus: 1
  container_image: "osdf:///{{CONTAINER_OSDF_PATH}}/sbank-igwn.sif"
  should_transfer_files: true

output:
  dir: "{{OUTPUT_DIR}}"
  log_dir: "{{LOG_DIR}}"
